; Floating HP Bar 1.1
; 所有选项都可以在不删档的情况下随时修改，下一场战斗生效。

[FloatingHPBar]
; 是否显示浮动血条（1 = 开，0 = 关）
Enabled = 1

; 是否在血条内显示 "当前血量 / 最大血量"（1 = 是，0 = 只显示当前血量）
ShowMaxHp = 0

; 血量显示方式：
;   0 = 自动（推荐）：
;       原版模式（CustomBattleFlagsMeaning = 0）显示敌人数据里的真实血量，
;       与游戏自身的扫描/图鉴数值一致；
;       Alternate Fantasy 模式（CustomBattleFlagsMeaning = 1）会自动扣除
;       脚本用的 +10000 血量。
;   1 = 始终显示原始数据血量（不做任何修正）
;   2 = 旧版行为：对列表中的“不死系 Boss”强制减 10000。
;       这个行为对尼克罗、奥兹玛等 Boss 是错误的，除非你确定需要，否则不要用。
HpMode = 0

; 是否在血条上方显示敌人名字（1 = 开，0 = 关）
ShowName = 1

; 敌人名字的字号（以 1080p 为基准，会自动按分辨率缩放）
NameFontSize = 15

; 血条尺寸（以 1080p 为基准，会自动按分辨率缩放）
BarWidth = 156
BarHeight = 22

; 血条在敌人头顶上方的额外像素偏移（1080p 基准）。
; 如果血条压到模型或离得太高，可以调这个值；负值会往下移。
OffsetY = 8

; 只给可被选为目标的敌人显示（1 = 是，0 = 全部可显示敌人）
ShowOnlyTargetable = 0
