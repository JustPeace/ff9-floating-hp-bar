; Floating HP Bar 1.2
; 所有选项都可以在不删档的情况下随时修改，下一场战斗生效。

[FloatingHPBar]
; 是否显示浮动血条（1 = 开，0 = 关）
Enabled = 1

; 是否在血条内显示 "当前血量 / 最大血量"（1 = 是，0 = 只显示当前血量）
ShowMaxHp = 0

; 血量显示方式：
;   0 = 自动（推荐）：原版扣除引擎识别的 Boss 的 10000 脚本预留 HP；
;       Alternate Fantasy 使用引擎逻辑 HP，普通敌人保持原值。
;   1 = 原始数据 HP（包含脚本预留值，供排查用）
;   2 = 旧版兼容行为（只处理原版不死 Boss）
HpMode = 0

; 是否在血条上方显示敌人名字（1 = 开，0 = 关）
ShowName = 1

; 敌人名字的字号（以 1080p 为基准，会自动按分辨率缩放）
NameFontSize = 15

; 血条尺寸（以 1080p 为基准，会自动按分辨率缩放）
BarWidth = 156
BarHeight = 22

; 血条在敌人头顶上方的额外像素偏移（1080p 基准）。
; 如果血条压到模型或离得太高，可以调这个值；负值会往下移。
OffsetY = 8

; 只给可被选为目标的敌人显示（1 = 是，0 = 全部可显示敌人）
ShowOnlyTargetable = 0
